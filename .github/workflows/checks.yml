name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'

# Each PR supersedes its own older runs. Each main push gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      python: ${{ steps.scope.outputs.python }}
      frontend: ${{ steps.scope.outputs.frontend }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '2' }}
      - name: Find last successful full run on main
        if: github.event_name == 'schedule'
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs" \
            -f branch=main -f event=schedule -f status=success -F per_page=100 \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          while IFS=$'\t' read -r id sha; do
            [[ -n "$id" ]] || continue
            # A successful docs-only night has no successful Full tests step.
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "python" and .conclusion == "success")
                    | .steps[] | select(.name == "Full tests" and .conclusion == "success")
                    | .conclusion')
            if [[ "$passed" == success ]]; then
              printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
              printf 'Last successful full run: %s (%s)\n' "$id" "$sha"
              break
            fi
          done <<< "$runs"
      - name: Select checks
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.baseline.outputs.sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          python=false
          frontend=false
          browser=false
          changed=$(mktemp)
          # Compare nights to a verified full run. For PRs and pushes, use the
          # checked-out tree's first parent only when it matches the event base.
          if [[ -n "$BASE_SHA" ]] &&
             { if [[ "$EVENT" == schedule ]]; then
                 git merge-base --is-ancestor "$BASE_SHA" HEAD
               else
                 [[ "$(git rev-parse --verify HEAD^1)" == "$BASE_SHA" ]]
               fi; } &&
             git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$changed"; then
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CHANGELOG.md|docs/*.md|docs/images/*.png|docs/images/*.gif|docs/images/*.webm)
                  continue ;;
              esac
              if [[ "$EVENT" == schedule ]]; then
                python=true; frontend=true; browser=true
                break
              fi
              case "$path" in
                # Offline-only modules. Revisit if the API or simulator starts using one.
                backend/autocan/acceptance.py|backend/autocan/acceptance_artifacts.py| \
                backend/autocan/acceptance_runtime.py|backend/autocan/bootstrap.py| \
                backend/autocan/bootstrap_benchmark.py|backend/autocan/event_benchmark.py| \
                backend/autocan/inference_benchmark.py|backend/autocan/ood_benchmark.py| \
                backend/autocan/window_benchmark.py|backend/autocan/isolation_forest.py| \
                backend/autocan/random_forest.py|backend/autocan/ml_experiment.py| \
                backend/autocan/ml_ood.py|backend/autocan/training_artifacts.py| \
                backend/autocan/training_data.py|backend/autocan/training_split.py| \
                backend/autocan/benchmark.py|backend/autocan/evaluation.py| \
                backend/autocan/model_artifacts.py| \
                backend/autocan/ood.py|backend/autocan/preprocessing.py| \
                backend/autocan/saved_evaluation.py|backend/autocan/score_artifacts.py| \
                backend/autocan/score_events.py|backend/autocan/window_evaluation.py|tests/*)
                  python=true ;;
                # Runtime and shared live/offline contracts.
                backend/autocan/features.py|backend/autocan/events.py|backend/autocan/traces.py| \
                backend/autocan/parquet.py|backend/autocan/factory.py|backend/autocan/scenarios.py| \
                backend/autocan/dbc.py|backend/autocan/network_profile.py| \
                backend/autocan/validation.py|backend/autocan/profiles/*|scenarios/*| \
                backend/autocan/api/__init__.py|backend/autocan/api/launch.py| \
                backend/autocan/api/live_features.py|backend/autocan/api/observation.py| \
                backend/autocan/api/runtime.py|backend/autocan/api/timeline.py| \
                backend/autocan/bus.py|backend/autocan/catalog.py|backend/autocan/clock.py| \
                backend/autocan/ecu.py|backend/autocan/faults.py|backend/autocan/network_ecu.py| \
                backend/autocan/network_runtime.py|backend/autocan/simulation.py| \
                backend/autocan/vehicle.py)
                  python=true; browser=true ;;
                frontend/*.py)
                  python=true; frontend=true; browser=true ;;
                frontend/*)
                  frontend=true; browser=true ;;
                *)
                  # Workflow, locks, shared config, frozen evidence and new roots.
                  python=true; frontend=true; browser=true ;;
              esac
            done < "$changed"
          else
            python=true
            frontend=true
            browser=true
          fi
          printf 'python=%s\nfrontend=%s\nbrowser=%s\n' \
            "$python" "$frontend" "$browser" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Validate local Markdown links and images
        run: |
          python -m pip install --disable-pip-version-check markdown-it-py==4.0.0 mdurl==0.1.2
          python .github/scripts/check_docs.py

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Typecheck
        run: uv run --locked mypy
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Fast tests
        if: github.event_name != 'schedule'
        run: >-
          uv run --locked pytest --durations=20
          --ignore=tests/test_acceptance.py
          --ignore=tests/test_benchmark.py
          --ignore=tests/test_inference_benchmark.py
          --ignore=tests/test_ml_ood.py
          --ignore=tests/test_ood.py
          --ignore=tests/test_training_data.py
      - name: Full tests
        if: github.event_name == 'schedule'
        run: uv run --locked pytest --durations=20

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The browser job builds and tests the production bundle.

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # Newer Ubuntu AppArmor defaults block the bundled Chromium user namespace.
    # Keep Chromium's sandbox enabled on a runner that supports it unchanged.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test:e2e:install -- --with-deps
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-acceptance
          path: frontend/test-results/
          retention-days: 7

  ci-result:
    name: CI result
    needs: [changes, docs, python, frontend, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_SELECTED: ${{ github.event_name != 'schedule' || needs.changes.outputs.python == 'true' }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PYTHON_SELECTED: ${{ needs.changes.outputs.python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_SELECTED: ${{ needs.changes.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          require_result() {
            local job="$1" selected="$2" result="$3"
            case "$selected:$result" in
              true:success|false:skipped) return 0 ;;
              *) echo "::error::$job selected=$selected result=$result"; return 1 ;;
            esac
          }

          failed=0
          require_result changes true "$CHANGES_RESULT" || failed=1
          require_result docs "$DOCS_SELECTED" "$DOCS_RESULT" || failed=1
          require_result python "$PYTHON_SELECTED" "$PYTHON_RESULT" || failed=1
          require_result frontend "$FRONTEND_SELECTED" "$FRONTEND_RESULT" || failed=1
          require_result browser "$BROWSER_SELECTED" "$BROWSER_RESULT" || failed=1
          exit "$failed"
