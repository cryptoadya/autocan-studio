[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "autocan-studio"
version = "0.0.1"
description = "A local-first synthetic CAN laboratory — foundation milestone"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cantools>=45.1.2",
]

[tool.uv]
required-version = "==0.13.6"

[tool.hatch.build.targets.wheel]
packages = ["backend/autocan"]

[tool.hatch.build.targets.sdist]
include = [
  "/backend",
  "/tests",
  "/docs",
  "/.github",
  "/.gitignore",
  "/.python-version",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests"]

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
