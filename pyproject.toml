[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "autocan-studio"
version = "2.0.0"
description = "A local-first synthetic CAN simulation and anomaly detection laboratory"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cantools>=45.1.2",
    "fastapi>=0.135",
    "numpy>=2.0",
    "pyarrow>=23",
    "python-can>=4.6.1",
    "scikit-learn==1.9.1",
    "uvicorn[standard]>=0.41",
]

[project.scripts]
autocan = "autocan.cli:main"

[tool.uv]
required-version = "==0.13.6"

[tool.hatch.build.targets.wheel]
packages = ["backend/autocan"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios/abs_missing_frames.json" = "autocan/demo_scenarios/abs_missing_frames.json"
"scenarios/rpm_spike.json" = "autocan/demo_scenarios/rpm_spike.json"
"scenarios/timing_jitter.json" = "autocan/demo_scenarios/timing_jitter.json"

[tool.hatch.build.targets.sdist]
include = [
  "/backend",
  "/frontend",
  "/tests",
  "/docs",
  "/scenarios",
  "/.github",
  "/.gitignore",
  "/.python-version",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
